name: Deploy Supabase Migrations
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Use the official Supabase CLI action to run migrations
      - name: Run Supabase Migrations
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Step 3: Execute the migration command against production
      - name: Push Migrations
        run: supabase db push --db-url ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
